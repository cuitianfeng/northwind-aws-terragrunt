name: Preflight Account Check
on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  preflight:
    name: Verify deployment account and role
    runs-on: ubuntu-latest
    steps:
      - name: configure aws credentials
        id: tfcreds
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::346612984731:role/githubactions-oidc-terragrunt
          role-session-name: GitHub_to_AWS_by_TF
          aws-region: us-east-2
          role-duration-seconds: 3600
      - name: Verify account identity
        run: |
          aws sts get-caller-identity --output json > identity.json
          python3 - <<'PY'
          import json, hashlib
          d = json.load(open('identity.json'))
          for k in ('Account','UserId','Arn'):
            v = d.get(k,'')
            print('%s fp16=%s len=%d' % (k, hashlib.sha256(v.encode()).hexdigest()[:16], len(v)))
          PY
          rm -f identity.json
